<!DOCTYPE html>
<html lang="UTF-8">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的世界VS</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family: "Microsoft YaHei", sans-serif}
        body{background:#1a1a1a;overflow:hidden;}
        
        /* 全屏游戏容器 - 固定UI不会溢出 */
        .game{
            position:fixed;
            width:100vw;
            height:100vh;
            left:0;top:0;
            background:#2c2f38;
            display:flex;
            flex-direction:column;
            align-items:center;
        }
        
        /* 血条栏 - 全屏自适应 */
        .ui-bar{
            width:100%;
            max-width:1200px;
            height:60px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 20px;
            margin-top:10px;
            position:relative;
            z-index:10;
        }
        .hp-box{
            width:42%;
            height:28px;
            background:#000;
            border:3px solid #fff;
            border-radius:4px;
            overflow:hidden;
        }
        .hp{
            width:100%;
            height:100%;
            background:#e53935;
            transition:width 0.12s linear;
        }
        .timer{
            font-size:30px;
            color:#ffcc00;
            font-weight:bold;
            text-shadow:2px 2px #000;
            position:absolute;
            left:50%;
            transform:translateX(-50%);
        }
        
        /* 画布 */
        #canvas{
            flex:1;
            width:100%;
            max-width:1200px;
            background:#3a4a5a;
            border:4px solid #ffcc00;
        }
        
        /* 操作说明 */
        .guide{
            position:absolute;
            top:70px;right:20px;
            width:320px;
            background:rgba(0,0,0,0.85);
            border:2px solid #ffcc00;
            color:#fff;
            padding:10px;
            font-size:13px;
            line-height:1.5;
            border-radius:4px;
            z-index:10;
        }
        .guide b{color:#ffcc00}
        
        /* 选角界面 */
        .select{
            position:fixed;
            width:100vw; height:100vh;
            left:0; top:0;
            background:#000;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            color:#fff;
            z-index:999;
        }
        .title{font-size:36px;color:#ffcc00;margin-bottom:20px}
        .chars{display:grid;grid-template-columns:repeat(3,160px);gap:12px}
        .char{
            width:160px; height:160px;
            border:3px solid #fff;
            display:grid;
            place-items:center;
            font-size:18px;
            cursor:pointer;
            border-radius:4px;
        }
        
        /* 结果与重启 */
        .result{
            position:fixed;
            top:45%;left:50%;
            transform:translate(-50%,-50%);
            color:#ffcc00;
            font-size:52px;
            font-weight:bold;
            text-shadow:4px 4px #000;
            display:none;
            z-index:9999;
        }
        .restart-btn{
            position:fixed;
            top:60%;left:50%;
            transform:translate(-50%,-50%);
            padding:18px 36px;
            font-size:22px;
            background:#ffcc00;
            color:#000;
            border:none;
            border-radius:8px;
            font-weight:bold;
            cursor:pointer;
            display:none;
            z-index:9999;
        }
    </style>
</head>
<body>

<div class="game">
    <div class="ui-bar">
        <div class="hp-box"><div class="hp" id="hp1"></div></div>
        <div class="timer" id="timer">99</div>
        <div class="hp-box"><div class="hp" id="hp2"></div></div>
    </div>

    <canvas id="canvas"></canvas>

    <div class="result" id="result"></div>
    <button class="restart-btn" id="restartBtn">重新开始 → 返回选择角色</button>

    <div class="guide">
        <b>1P（WASD）</b><br>
        波动拳：↓ → + 拳<br>
        U轻拳 | I轻脚 | J重拳 | K重脚<br><br>
        <b>2P（方向键）</b><br>
        波动拳：↓ → + 拳<br>
        7轻拳 | 8轻脚 | 4重拳 | 5重脚
    </div>
</div>

<!-- 选角界面 -->
<div class="select" id="selectScreen">
    <div class="title">1P 选择角色</div>
    <div class="chars" id="charGrid"></div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const keys = {};

// 音效
const hitSound = new Audio('https://www.soundjay.com/game/punch-1.mp3');
const skillSound = new Audio('https://www.soundjay.com/game/laser-1.mp3');
const bgm = new Audio('https://www.soundjay.com/game/arcade-game-1.mp3');
bgm.loop=true; bgm.volume=0.3;

// ========== 我的世界 1:1 像素级角色数据 ==========
const chars = [
    {name:"苦力怕",h:"#0FAE0F",b:"#0B8A0B",a:"#0B8A0B",l:"#097009"},
    {name:"村民",h:"#A67C52",b:"#8B4513",a:"#6F4523",l:"#5D3A1C"},
    {name:"僵尸",h:"#4ABF00",b:"#3A9900",a:"#3A9900",l:"#2A7A00"},
    {name:"女巫",h:"#7A42CC",b:"#4A1A7D",a:"#3A0A6D",l:"#2A055D"},
    {name:"骷髅",h:"#E0E0E0",b:"#C0C0C0",a:"#B0B0B0",l:"#A0A0A0"},
    {name:"末影龙",h:"#2B0B3E",b:"#4B1A6D",a:"#800080",l:"#1A052D"}
];

const game = {
    phase:'select1', time:99, ended:false,
    p1:{x:280,y:430,hp:100,c:0,act:'stand',st:'normal',flip:false},
    p2:{x:880,y:430,hp:100,c:2,act:'stand',st:'normal',flip:true},
    bullets:[]
};

// 按键
document.addEventListener('keydown',e=>{keys[e.key]=true});
document.addEventListener('keyup',e=>{keys[e.key]=false});

// 初始化选角
const grid = document.getElementById('charGrid');
chars.forEach((ch,i)=>{
    let d=document.createElement('div');
    d.className='char';d.innerText=ch.name;d.style.background=ch.h;
    d.onclick=()=>{
        if(game.phase=='select1'){
            game.p1.c=i;game.phase='select2';
            document.querySelector('.title').innerText='2P 选择角色';
        }else{
            game.p2.c=i;
            document.getElementById('selectScreen').style.display='none';
            startGame();
        }
    }
    grid.appendChild(d);
});

// ========== 【极致MC像素绘制】 ==========
function draw(p){
    const cx=p.x, cy=p.y, f=p.flip?-1:1;
    const c=chars[p.c];

    // === 1 苦力怕 ===
    if(p.c===0){
        ctx.fillStyle=c.h;ctx.fillRect(cx-26,cy-64,52,52);
        ctx.fillStyle="#000";ctx.fillRect(cx-18,cy-52,14,14);ctx.fillRect(cx+4,cy-52,14,14);
        ctx.fillRect(cx-14,cy-30,28,10);
        ctx.fillStyle=c.b;ctx.fillRect(cx-20,cy-12,40,52);
        ctx.fillStyle=c.a;ctx.fillRect(cx-34,cy-10,14,42);ctx.fillRect(cx+20,cy-10,14,42);
        ctx.fillStyle=c.l;ctx.fillRect(cx-14,cy+40,12,34);ctx.fillRect(cx+2,cy+40,12,34);
    }

    // === 2 村民 ===
    if(p.c===1){
        ctx.fillStyle=c.h;ctx.fillRect(cx-24,cy-60,48,48);
        ctx.fillStyle="#fff";ctx.fillRect(cx-10,cy-48,20,10);ctx.fillRect(cx-6,cy-38,12,14);
        ctx.fillStyle=c.b;ctx.fillRect(cx-26,cy-16,52,56);
        ctx.fillStyle=c.a;ctx.fillRect(cx-36,cy-12,16,44);ctx.fillRect(cx+20,cy-12,16,44);
        ctx.fillStyle=c.l;ctx.fillRect(cx-12,cy+40,12,36);ctx.fillRect(cx+0,cy+40,12,36);
    }

    // === 3 僵尸 ===
    if(p.c===2){
        ctx.fillStyle=c.h;ctx.fillRect(cx-26,cy-64,52,52);
        ctx.fillStyle="#000";ctx.fillRect(cx-18,cy-52,14,14);ctx.fillRect(cx+4,cy-52,14,14);
        ctx.fillStyle=c.b;ctx.fillRect(cx-20,cy-12,40,52);
        ctx.fillStyle=c.a;ctx.fillRect(cx-34,cy-10,14,42);ctx.fillRect(cx+20,cy-10,14,42);
        ctx.fillStyle=c.l;ctx.fillRect(cx-14,cy+40,12,34);ctx.fillRect(cx+2,cy+40,12,34);
    }

    // === 4 女巫 ===
    if(p.c===3){
        ctx.fillStyle="#522A99";ctx.fillRect(cx-30,cy-72,60,24);
        ctx.fillStyle=c.h;ctx.fillRect(cx-26,cy-48,52,40);
        ctx.fillStyle="#fff";ctx.fillRect(cx-12,cy-40,24,10);
        ctx.fillStyle=c.b;ctx.fillRect(cx-28,cy-8,56,60);
        ctx.fillStyle=c.a;ctx.fillRect(cx-38,cy-6,18,48);ctx.fillRect(cx+20,cy-6,18,48);
        ctx.fillStyle=c.l;ctx.fillRect(cx-14,cy+52,12,30);ctx.fillRect(cx+2,cy+52,12,30);
    }

    // === 5 骷髅 ===
    if(p.c===4){
        ctx.fillStyle=c.h;ctx.fillRect(cx-24,cy-60,48,48);
        ctx.fillStyle="#000";ctx.fillRect(cx-16,cy-50,12,12);ctx.fillRect(cx+4,cy-50,12,12);
        ctx.fillStyle=c.b;ctx.fillRect(cx-18,cy-12,36,48);
        ctx.fillStyle=c.a;ctx.fillRect(cx-30,cy-10,12,42);ctx.fillRect(cx+18,cy-10,12,42);
        ctx.fillStyle=c.l;ctx.fillRect(cx-12,cy+36,12,38);ctx.fillRect(cx+0,cy+36,12,38);
    }

    // === 6 末影龙 ===
    if(p.c===5){
        ctx.fillStyle=c.h;ctx.fillRect(cx-40,cy-76,80,52);
        ctx.fillStyle=c.a;ctx.fillRect(cx-68,cy-64,48,36);ctx.fillRect(cx+20,cy-64,48,36);
        ctx.fillStyle=c.b;ctx.fillRect(cx-28,cy-24,56,64);
        ctx.fillStyle=c.a;ctx.fillRect(cx-38,cy-20,18,56);ctx.fillRect(cx+20,cy-20,18,56);
        ctx.fillStyle=c.l;ctx.fillRect(cx-16,cy+40,14,40);ctx.fillRect(cx+2,cy+40,14,40);
    }

    // 动作
    if(p.act.includes('punch')){ctx.fillStyle="#ffeb3b";ctx.fillRect(cx+f*46,cy-4,38,16)}
    if(p.act.includes('kick')){ctx.fillStyle="#ff9800";ctx.fillRect(cx+f*38,cy+26,46,18)}
    if(p.st=="defend"){ctx.fillStyle="rgba(100,200,255,0.6)";ctx.fillRect(cx-42,cy-84,84,150)}
}

// 波动拳
function drawBullets(){
    game.bullets.forEach((b,i)=>{
        ctx.fillStyle=b.color;
        ctx.beginPath();ctx.arc(b.x,b.y,16,0,Math.PI*2);ctx.fill();
        ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(b.x,b.y,8,0,Math.PI*2);ctx.fill();
        b.x+=b.vx; b.t--;
        if(b.t<0)game.bullets.splice(i,1);
        const tar=b.vx>0?game.p2:game.p1;
        if(Math.hypot(b.x-tar.x,b.y-tar.y)<40){
            if(tar.st!='defend')tar.hp=Math.max(0,tar.hp-2);
            game.bullets.splice(i,1);
        }
    })
}

// 发射波动拳
function fire(p,isP1){
    skillSound.cloneNode(true).play();
    game.bullets.push({
        x:p.x, y:p.y-22,
        vx:isP1?6:-6,
        color:chars[p.c].h,
        t:70
    });
}

// 攻击判定
function hit(a,b,d){
    if(Math.abs(a.x-b.x)>110||b.st=='defend')return;
    b.hp=Math.max(0,b.hp-d);
    b.st='hit';
    hitSound.cloneNode(true).play();
    setTimeout(()=>b.st='normal',180);
}

// 发波指令（不卡人）
function checkSkills(){
    if(keys.d&&keys.s&&(keys.u||keys.j)) fire(game.p1,true);
    if(keys.ArrowRight&&keys.ArrowDown&&(keys['7']||keys['4'])) fire(game.p2,false);
}

// 更新游戏
function update(){
    if(game.ended)return;
    let p1=game.p1,p2=game.p2;
    p1.act=p2.act='stand';
    p1.y=p2.y=430;

    const speed=2.3;

    // P1
    p1.st=keys.a?'defend':'normal';
    if(keys.w)p1.y-=speed;if(keys.s)p1.y+=speed;
    if(keys.a)p1.x-=speed;if(keys.d)p1.x+=speed;
    if(keys.u){p1.act='punch';hit(p1,p2,0.6)}
    if(keys.j){p1.act='punch2';hit(p1,p2,1.1)}
    if(keys.i){p1.act='kick';hit(p1,p2,0.7)}
    if(keys.k){p1.act='kick2';hit(p1,p2,1.2)}

    // P2
    p2.st=keys.ArrowLeft?'defend':'normal';
    if(keys.ArrowUp)p2.y-=speed;if(keys.ArrowDown)p2.y+=speed;
    if(keys.ArrowLeft)p2.x-=speed;if(keys.ArrowRight)p2.x+=speed;
    if(keys['7']){p2.act='punch';hit(p2,p1,0.6)}
    if(keys['4']){p2.act='punch2';hit(p2,p1,1.1)}
    if(keys['8']){p2.act='kick';hit(p2,p1,0.7)}
    if(keys['5']){p2.act='kick2';hit(p2,p1,1.2)}

    checkSkills();

    // 边界
    p1.x=Math.max(30,Math.min(canvas.width-30,p1.x));
    p2.x=Math.max(30,Math.min(canvas.width-30,p2.x));

    document.getElementById('hp1').style.width=p1.hp+'%';
    document.getElementById('hp2').style.width=p2.hp+'%';
}

// 渲染
function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    draw(game.p1);
    draw(game.p2);
    drawBullets();
}

// 主循环
function loop(){update();render();requestAnimationFrame(loop)}

// 胜负判定
function checkEnd(){
    if(game.p1.hp<=0||game.p2.hp<=0||game.time<=0){
        game.ended=true;
        const r=document.getElementById('result');
        const btn=document.getElementById('restartBtn');
        if(game.p1.hp>game.p2.hp) r.innerText='1P 获胜！';
        else if(game.p2.hp>game.p1.hp) r.innerText='2P 获胜！';
        else r.innerText='平局！';
        r.style.display='block';
        btn.style.display='block';
    }
}

// 开始游戏
function startGame(){
    canvas.width=1200;
    canvas.height=540;
    bgm.currentTime=0;bgm.play();
    loop();
    game.timer=setInterval(()=>{
        if(game.time>0&&!game.ended)game.time--;
        document.getElementById('timer').innerText=game.time;
        checkEnd();
    },1000);
}

// 重新开始
document.getElementById('restartBtn').onclick=()=>{
    clearInterval(game.timer);
    game.time=99;game.ended=false;
    game.p1={x:280,y:430,hp:100,c:0,act:'stand',st:'normal',flip:false};
    game.p2={x:880,y:430,hp:100,c:2,act:'stand',st:'normal',flip:true};
    game.bullets=[];
    document.getElementById('result').style.display='none';
    document.getElementById('restartBtn').style.display='none';
    document.getElementById('selectScreen').style.display='flex';
    document.querySelector('.title').innerText='1P 选择角色';
    game.phase='select1';
};
</script>
</body>
</html>
